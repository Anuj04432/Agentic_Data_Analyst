[project]
name = "ml-project"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Anuj04432", email = "anujwagmore835@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "dotenv>=0.9.9",
    "joblib>=1.3.0",
    "matplotlib>=3.7.0",
    "numpy>=1.24.0",
    "openpyxl>=3.1.0",
    "pandas>=2.0.0",
    "pyarrow>=14.0.0",
    "python-dotenv>=1.0.0",
    "scikit-learn>=1.3.0",
    "seaborn>=0.12.0",
    "setuptools>=68.0.0",
    "streamlit>=1.30.0",
]

[project.scripts]
ml-project = "ml_project:main"

[build-system]
requires = ["uv_build>=0.12.2,<0.13.0"]
